name: Compilar APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Bajar lista de bloqueo
        run: |
          mkdir -p app/src/main/assets
          curl -sL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts | grep '^0.0.0.0 ' | awk '{print $2}' | grep -v '^0.0.0.0$' > app/src/main/assets/blocklist.txt
          wc -l app/src/main/assets/blocklist.txt
      - run: gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk BloqueaYa.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BloqueaYa v1.0.${{ github.run_number }}
          files: BloqueaYa.apk
          make_latest: true
