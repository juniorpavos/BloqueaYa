name: Compilar MisHoras
on:
  push:
    branches: [ main ]
    paths: [ "mishoras/**", ".github/workflows/mishoras.yml" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.11.1' }
      - run: sed -i "s/__BUILD__/${{ github.run_number }}/" mishoras/app/src/main/assets/index.html
      - run: cd mishoras && gradle :app:assembleRelease --no-daemon
      - run: cp mishoras/app/build/outputs/apk/release/app-release.apk Horasdesalida.apk
      - run: sed -i "s/__TIENDA__/play/" mishoras/app/src/main/assets/index.html
      - run: cd mishoras && gradle :app:bundleRelease --no-daemon
      - run: cp mishoras/app/build/outputs/bundle/release/app-release.aab Horasdesalida-PlayStore.aab
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: Horasdesalida-v1.0.${{ github.run_number }}
          name: Horasdesalida v1.0.${{ github.run_number }}
          files: |
            Horasdesalida.apk
            Horasdesalida-PlayStore.aab
          make_latest: false
